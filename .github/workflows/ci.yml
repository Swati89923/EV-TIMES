name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evtime-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run tests
        run: chmod +x gradlew && ./gradlew --no-daemon test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, lint and build
        shell: bash
        run: |
          if [ ! -f evtime-frontend/package.json ]; then
            echo "No frontend on this branch yet; skipping."
            exit 0
          fi
          cd evtime-frontend
          npm ci
          npm run lint
          npm run build
