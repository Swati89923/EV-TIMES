<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EV Times - news, analysis and reviews on electric vehicles, batteries, charging and policy." />
    <meta name="theme-color" content="#0b1f1a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Replace https://example.com with your real domain before going live -->
    <link rel="canonical" href="https://example.com/" />
    <link rel="alternate" type="application/rss+xml" title="EV Times" href="https://example.com/rss.xml" />
    <meta property="og:site_name" content="EV Times" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EV Times - Electric vehicle news" />
    <meta property="og:description" content="News, analysis and reviews on electric vehicles, batteries, charging and policy." />
    <meta property="og:image" content="https://example.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EV Times - Electric vehicle news" />
    <meta name="twitter:description" content="News, analysis and reviews on electric vehicles, batteries, charging and policy." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>EV Times</title>
    <script>
      try {
        var t = localStorage.getItem('evtimes-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <noscript>EV Times needs JavaScript to show the latest electric vehicle news. Please enable JavaScript and reload the page.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
