spring.application.name=evtime-backend

# Database (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evtimesdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: JWT_SECRET is mandatory and must be at least 32 characters
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma separated list of allowed browser origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# First administrator (created on startup when both are set)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Insert sample articles when the news table is empty (useful for demos)
app.seed.enabled=${SEED_DEMO_DATA:false}

# Image uploads
app.upload.dir=${UPLOAD_DIR:uploads}
# Public URL of this API (used to build image links). Blank = derive from the request.
app.upload.public-base-url=${PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Platform port + health endpoint for deployment health checks
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Live news import from public RSS feeds (name|url, comma separated)
app.feeds.enabled=${FEEDS_ENABLED:true}
app.feeds.interval-ms=${FEEDS_INTERVAL_MS:600000}
app.feeds.max-per-feed=40
app.feeds.sources=${FEED_SOURCES:Electrek|https://electrek.co/feed/,InsideEVs|https://insideevs.com/rss/news/all/,CleanTechnica|https://cleantechnica.com/feed/,electrive|https://electrive.com/feed/,Teslarati|https://www.teslarati.com/feed/,EVreporter|https://evreporter.com/feed/}
