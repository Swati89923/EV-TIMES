spring.application.name=evtime-backend

# Database (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evtimesdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: JWT_SECRET is mandatory and must be at least 32 characters
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma separated list of allowed browser origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
