# Local development profile: in-memory database, no MySQL needed.
# Run with: SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun
spring.datasource.url=jdbc:h2:mem:evtimes;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.admin.email=${ADMIN_EMAIL:admin@evtimes.dev}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
