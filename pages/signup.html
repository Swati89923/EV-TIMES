<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">

    <title>Signup</title>

</head>
<body>

<section class="auth-section">

    <div class="auth-card">

        <h2>Create Account</h2>

        <input
            type="text"
            placeholder="Enter Name"
            class="auth-input"
            id="signup-name"
        >

        <input
            type="email"
            placeholder="Enter Email"
            class="auth-input"
            id="signup-email"
        >

        <input
            type="password"
            placeholder="Enter Password"
            class="auth-input"
            id="signup-password"
        >

        <input
            type="password"
            placeholder="Confirm Password"
            class="auth-input"
            id="confirm-password"
        >

        <button
            class="primary-btn"
            id="signup-btn"
        >
            Signup
        </button>

        <p>
            Already have an account?
            <a href="./login.html">
                Login
            </a>
        </p>

    </div>

</section>

<script src="../js/auth.js"></script>

</body>
</html>
