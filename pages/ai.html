<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/utility.css">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>

    <section class="container ai-section">

        <input

            id="user-input"

        <button

            id="send-btn"
        >
            Send
        </button>
        <button class="clear-btn">

    </div>

</div>

    </section>
