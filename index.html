<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/utility.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>EVTIMES</title>

</head>

<body>

<nav class="navbar">

    <h1 class="logo">EVTIMES</h1>

    <ul class="nav-links">
        <li>Home</li>
        <li>News</li>
        <li>AI</li>
        <li>About</li>

        <li class="auth-btn">
            <span class="user-icon">👤</span>
            Account
        </li>
    </ul>

</nav>

<section class="hero container">

    <div class="hero-content">

        <h1>
            The Future Of <br>
            EV Intelligence
        </h1>

        <p>
            Your one-stop platform for EV news,
            charging updates, AI insights and policies.
        </p>

        <div class="hero-buttons">

            <button class="primary-btn">
                Explore News
            </button>

            <button class="secondary-btn">
                AI Insights
            </button>

        </div>

    </div>

</section>

<section class="news-section">

    <h2 class="section-title">
        Trending EV News
    </h2>

    <div class="search-box">

        <input 
            type="text"
            placeholder="Search EV news..."
            class="search-input"
        >

    </div>
    <div class="filter-buttons">

    <button class="filter-btn active">
        All
    </button>

    <button class="filter-btn">
        Technology
    </button>

    <button class="filter-btn">
        AI
    </button>

    <button class="filter-btn">
        Infrastructure
    </button>

</div>

    <div class="news-container container">

    </div>
    <div class="load-more-box">

    <button class="load-more-btn">
        Load More
    </button>

</div>

</section>

<section class="stats-section">

    <div class="stat-box">
        <h2>38M+</h2>
        <p>EVs Worldwide</p>
    </div>

    <div class="stat-box">
        <h2>3.2M</h2>
        <p>Charging Stations</p>
    </div>

    <div class="stat-box">
        <h2>14%</h2>
        <p>Market Share</p>
    </div>

    <div class="stat-box">
        <h2>$847B</h2>
        <p>EV Industry Value</p>
    </div>

</section>

<script src="./js/app.js"></script>

</body>
</html>
